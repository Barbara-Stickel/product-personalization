[project]
name = "product-lora"
version = "0.1.0"
description = "Reproducible product-specific FLUX.2 Klein LoRA experiments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pillow>=11.0",
  "pydantic>=2.10",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "requests>=2.32",
  "typer>=0.15",
  "mflux==0.24.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
product-lora = "product_lora.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_lora"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["B008"]  # Typer's documented declarative option pattern.

